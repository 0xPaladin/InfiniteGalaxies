<!DOCTYPE html>
<html>

<head>
  <title>Rogue Galaxies</title>
  <link rel="stylesheet" type="text/css" href="lib/tachyons.4.12.0.min.css">
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="src/main.css">
  <link rel="stylesheet" type="text/css" href="src/engine/render/threeHost.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
    }

    #rogueHost {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #display {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #info {
      width: 320px;
      padding: 16px;
      background: #111;
      border-left: 2px solid #444;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
    }

    #info h3 {
      margin: 0 0 8px 0;
      color: #fff4b5;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      border: 1px solid #555;
      padding: 12px 24px;
      border-radius: 4px;
      z-index: 1000;
      cursor: pointer;
      font-family: monospace;
    }

    .toast button {
      margin-left: 12px;
      background: #333;
      color: #fff;
      border: 1px solid #666;
      padding: 2px 8px;
      cursor: pointer;
    }

    .toast button:hover {
      background: #555;
    }
  </style>
</head>

<body>
  <div id="rogueHost">
    <div id="display"></div>
    <div id="info">
      <h3>System Info</h3>
      <div id="infoContent">Click a star to view system data.</div>
    </div>
  </div>
  <div id="toastContainer"></div>
  <script src="lib/rot.min.js"></script>
  <script src="lib/d3.v7.min.js"></script>
  <script src="lib/lil-gui.0.20.js"></script>
  <script src="lib/localforage.min.js"></script>
  <script type="module" src="src/rogue.js"></script>
</body>

</html>
