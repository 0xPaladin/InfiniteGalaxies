<!DOCTYPE html>
<html>

<head>
  <title>Rogue Galaxies</title>
  <!-- AFMGData (vendored at lib/afmg/) import map — its own CDN deps, unbundled -->
  <script type="importmap">
    {
      "imports": {
        "d3": "https://esm.sh/d3@7.9.0",
        "d3-geo-voronoi": "https://esm.sh/d3-geo-voronoi@2",
        "alea": "https://esm.sh/alea@1.0.1",
        "simplex-noise": "https://esm.sh/simplex-noise@4.0.3",
        "delaunator": "https://esm.sh/delaunator@5.0.1",
        "polylabel": "https://esm.sh/polylabel@1.1.0",
        "lineclip": "https://esm.sh/lineclip@1.1.5"
      }
    }
  </script>
  <script src="lib/afmg/utils/flatqueue.js"></script>
  <link rel="stylesheet" type="text/css" href="lib/tachyons.4.12.0.min.css">
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="src/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
    }

    #rogueHost {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #rogueMain {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #breadcrumb {
      padding: 8px 16px;
      font-size: 13px;
      color: #aac;
      border-bottom: 1px solid #333;
      white-space: nowrap;
      overflow-x: auto;
    }

    #display {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }

    /* d3 planet view (rogue/planet.js) — sits over the same area as #display,
       toggled visible only at the 'planet' navigation level (src/rogue.js). */
    #planetDisplay {
      flex: 1;
      display: none;
      justify-content: center;
      align-items: center;
      min-height: 0;
      gap: 24px;
    }

    #planetDisplay svg .region-cell {
      cursor: pointer;
      stroke: #000;
      stroke-width: 0.3;
    }

    #planetDisplay svg .region-cell:hover {
      stroke: #fff;
      stroke-width: 1;
    }

    #planetDisplay .hemisphere-label {
      fill: #aac;
      font-family: monospace;
      font-size: 11px;
      text-anchor: middle;
    }

    #info {
      width: 320px;
      padding: 16px;
      background: #111;
      border-left: 2px solid #444;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
    }

    #info h3 {
      margin: 0 0 8px 0;
      color: #fff4b5;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      border: 1px solid #555;
      padding: 12px 24px;
      border-radius: 4px;
      z-index: 1000;
      cursor: pointer;
      font-family: monospace;
    }

    .toast button {
      margin-left: 12px;
      background: #333;
      color: #fff;
      border: 1px solid #666;
      padding: 2px 8px;
      cursor: pointer;
    }

    .toast button:hover {
      background: #555;
    }
  </style>
</head>

<body>
  <div id="rogueHost">
    <div id="rogueMain">
      <div id="breadcrumb">GALAXY</div>
      <div id="display"></div>
      <div id="planetDisplay"></div>
    </div>
  </div>
  <div id="toastContainer"></div>
  <script src="lib/rot.min.js"></script>
  <script src="lib/localforage.min.js"></script>
  <script type="module" src="src/rogue.js"></script>
</body>

</html>
